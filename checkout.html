<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout iBisne · Confirma tu paquete</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="iBisne Checkout">
<link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon.png">
<meta name="description" content="Confirma tu paquete iBisne y nos contactamos contigo en horas.">
<meta name="robots" content="noindex">

<!-- v19.0 · Restore theme inline ANTES del CSS · evita FOUC -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('ibisne-site-theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (_) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="design-system-v2/components.css?v=3.2.0">
<link rel="stylesheet" href="assets/sitio/quiz-guiado.css?v=19.8.2">
<link rel="stylesheet" href="assets/sitio/checkout.css?v=19.8.2">
</head>
<body class="co-body">

<!-- ═══════════ HEADER ═══════════ -->
<header class="co-header">
  <a href="/" class="co-logo">
    <span class="co-logo-back" aria-hidden="true">←</span>
    <img src="brand/iBisne_blanco.png" alt="iBisne" class="co-logo-img" width="120" height="32">
  </a>
  <a href="/quiz.html" class="co-back-link">← Volver al cotizador</a>
</header>

<!-- ═══════════ MAIN: form + summary lateral ═══════════ -->
<main class="co-main" data-checkout>
  <div class="co-loading" data-loading>
    <p>Cargando paquete…</p>
  </div>
</main>

<!-- ═══════════ Scripts · v19.1 todos defer en orden (icons→data→motor) ═══════════ -->

</body>
