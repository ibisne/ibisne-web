<style>
  body{ display: flex; flex-direction: column; min-height: 100vh; }
  main{
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 64px 32px;
    text-align: center;
    gap: 64px;
    position: relative; z-index: 3;
  }
  .question-block{
    display: flex; flex-direction: column;
    align-items: center; gap: 56px;
    max-width: 1400px;
  }
  .question-eyebrow{
    font-family: var(--font-mono);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--text-muted);
  }
  .question-eyebrow .accent{ color: var(--accent-mint); }
  .question{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(48px, 7.5vw, 104px);
    letter-spacing: -0.045em;
    line-height: 1;
    color: var(--text-primary);
  }
  .question .highlight{ color: var(--accent-mint, #AEFFC8); }

  .cta-row{
    display: flex; gap: 22px; margin-top: 8px;
  }
  .cta-big{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    padding: 24px 60px;
    border: 1px solid var(--bg-line);
    background: transparent;
    color: var(--text-primary);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.22s ease;
    border-radius: 15px;
  }
  .cta-big.primary{
    background: var(--accent);
    color: var(--bg-deep);
    border-color: var(--accent);
  }
  .cta-big.primary:hover{ background: var(--accent-mint); border-color: var(--accent-mint); }
  .cta-big.line:hover{ border-color: var(--accent-mint); color: var(--accent-mint); }

  @media (max-width: 768px){
    main{ padding: 32px 16px; gap: 36px; }
    .question-block{ gap: 36px; }
    .question{ font-size: clamp(30px, 9vw, 56px); }
    .cta-row{ flex-direction: column; width: 100%; max-width: 360px; }
    .cta-big{ width: 100%; text-align: center; padding: 22px 28px; font-size: 15px; }
  }
</style>
</head>
