<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iBisne · En mantenimiento</title>
<meta name="description" content="iBisne · En mantenimiento.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/assets/pwa/icon-192.png">
<link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #FFFFFF; }
  body {
    font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #1D1D1F;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(32px, 5vw, 56px);
    opacity: 0;
    transform: translateY(10px);
    animation: fadeIn 900ms cubic-bezier(0.16, 1, 0.3, 1) 200ms forwards;
  }
  .logo {
    height: clamp(52px, 7vw, 80px);
    width: auto;
    display: block;
    filter: invert(1);                 /* PNG is white · invert to black on white bg */
  }
  .phrase {
    font-size: clamp(20px, 2.6vw, 28px);
    font-weight: 500;
    letter-spacing: -0.015em;
    color: #6E6E73;
    text-align: center;
    line-height: 1.2;
  }
  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wrap { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <img src="/brand/iBisne_blanco.png" alt="iBisne" class="logo">
    <p class="phrase">En mantenimiento</p>
  </main>
</body>
</html>
