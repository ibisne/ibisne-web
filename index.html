<style>
  body{ display: flex; flex-direction: column; min-height: 100vh; }
  main{
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 64px 32px 32px;
    gap: 96px;
    position: relative; z-index: 3;
    max-width: 1280px;
    margin: 0 auto;
    width: 100%;
  }

  /* HERO · pregunta · igual que antes pero ahora con 3 CTAs */
  .question-block{
    display: flex; flex-direction: column;
    align-items: center; gap: 48px;
    text-align: center;
    padding-top: 40px;
  }
  .question-eyebrow{
    font-family: var(--font-mono);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--text-muted);
  }
  .question-eyebrow .accent{ color: var(--accent-mint); }
  .question{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(44px, 6.5vw, 84px);
    letter-spacing: -0.045em;
    line-height: 1.02;
    color: var(--text-primary);
  }
  .question .highlight{ color: var(--accent-mint, #AEFFC8); }
  .question-sub{
    font-family: var(--font-display);
    font-size: clamp(15px, 1.4vw, 18px);
    color: var(--text-secondary);
    max-width: 580px;
    line-height: 1.55;
  }

  /* CTA primario que lleva a las 3 puertas */
  .hero-cta-row{ display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .cta-big{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    padding: 20px 44px;
    border: 1px solid var(--bg-line);
    background: transparent;
    color: var(--text-primary);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.22s ease;
    border-radius: 14px;
  }
  .cta-big.primary{
    background: var(--accent);
    color: var(--bg-deep);
    border-color: var(--accent);
  }
  .cta-big.primary:hover{ background: var(--accent-mint); border-color: var(--accent-mint); }
  .cta-big.line:hover{ border-color: var(--accent-mint); color: var(--accent-mint); }

  /* ─── SECCIÓN · 3 puertas ─── */
  .home-doors {
    text-align: center;
  }
  .home-doors .h-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--accent-mint);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .home-doors h2 {
    font-family: var(--font-display);
    font-size: clamp(28px, 3.4vw, 40px);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.1;
    margin-bottom: 16px;
  }
  .home-doors h2 .accent { color: var(--accent); }
  .home-doors p {
    font-size: 15px;
    color: var(--text-secondary);
    max-width: 540px;
    margin: 0 auto 36px;
  }
  .home-doors-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    max-width: 980px;
    margin: 0 auto;
  }
  .door-tile {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 28px 24px;
    background: var(--bg-paper);
    border: 1px solid var(--bg-line);
    border-radius: 14px;
    text-decoration: none;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    color: var(--text-primary);
  }
  .door-tile:hover {
    border-color: var(--accent);
    background: linear-gradient(180deg, var(--accent-soft) 0%, var(--bg-paper) 100%);
    transform: translateY(-4px);
  }
  .door-tile-icon {
    width: 56px; height: 56px;
    background: var(--bg);
    border: 1px solid var(--bg-line);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-mint);
  }
  .door-tile-icon svg { width: 28px; height: 28px; }
  .door-tile-label {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .door-tile-sub {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.45;
    flex: 1;
  }
  .door-tile-arrow {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    text-transform: uppercase;
    transition: color 0.2s ease;
  }
  .door-tile:hover .door-tile-arrow { color: var(--accent); }

  /* ─── SECCIÓN · Marketplace teaser ─── */
  .home-mp {
    background: linear-gradient(180deg, rgba(174,255,200,0.03) 0%, transparent 100%);
    border: 1px solid var(--bg-line);
    border-radius: 16px;
    padding: 48px;
  }
  .home-mp-head {
    text-align: center;
    margin-bottom: 32px;
  }
  .home-mp-head .h-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--accent-mint);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .home-mp-head h2 {
    font-family: var(--font-display);
    font-size: clamp(24px, 3vw, 36px);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.1;
  }
  .home-mp-head h2 .accent { color: var(--accent); }
  .home-mp-head .stats {
    display: flex; gap: 32px;
    justify-content: center; margin-top: 18px;
    flex-wrap: wrap;
  }
  .home-mp-head .stat {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }
  .home-mp-head .stat .n {
    color: var(--accent);
    font-size: 14px;
    font-weight: 700;
    display: block;
  }
  .home-mp-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .mp-card {
    padding: 18px 16px;
    background: var(--bg);
    border: 1px solid var(--bg-line);
    border-radius: 10px;
    transition: border-color 0.2s ease;
  }
  .mp-card:hover { border-color: var(--accent-mint); }
  .mp-card-tag {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .mp-card-name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    margin: 6px 0 10px;
  }
  .mp-card-meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .mp-card-progress {
    height: 4px;
    background: var(--bg-line);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .mp-card-progress span {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-mint));
  }
  .mp-card-funded {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent-mint);
  }
  .home-mp-foot {
    text-align: center;
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  }

  /* ─── SECCIÓN · Inversionista CTA banner ─── */
  .home-inv {
    background: var(--bg-paper);
    border: 1px solid var(--bg-line);
    border-radius: 16px;
    padding: 40px 48px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 32px;
    align-items: center;
  }
  .home-inv-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent-mint);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .home-inv h3 {
    font-family: var(--font-display);
    font-size: clamp(22px, 2.4vw, 30px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: 6px;
  }
  .home-inv p {
    color: var(--text-secondary);
    font-size: 14px;
    max-width: 540px;
    line-height: 1.5;
  }
  .home-inv-cta {
    display: flex; gap: 10px; flex-wrap: wrap;
  }

  @media (max-width: 900px){
    main{ padding: 32px 18px; gap: 56px; }
    .home-doors-grid{ grid-template-columns: 1fr; }
    .home-mp-grid{ grid-template-columns: repeat(2, 1fr); }
    .home-mp{ padding: 32px 24px; }
    .home-inv{ grid-template-columns: 1fr; padding: 28px; text-align: left; }
  }
  @media (max-width: 540px){
    .question-block{ gap: 28px; padding-top: 16px; }
    .question{ font-size: clamp(28px, 9vw, 48px); }
    .hero-cta-row{ flex-direction: column; width: 100%; max-width: 320px; margin: 0 auto; }
    .cta-big{ width: 100%; text-align: center; padding: 18px 24px; font-size: 14px; }
    .home-mp-grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
