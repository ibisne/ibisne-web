<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 · Página no encontrada · iBisne</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system-v2/tokens.css">
<style>
  body{ font-family: var(--font-display); background: var(--bg-deep); color: var(--text-primary); margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 32px; text-align: center; }
  .code{ font-family: var(--font-mono); font-size: 14px; color: var(--text-muted); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 24px; }
  h1{ font-size: clamp(72px, 12vw, 160px); font-weight: 800; letter-spacing: -0.045em; line-height: 1; margin: 0 0 16px; }
  h1 .accent{ color: var(--text-primary); }
  p{ font-size: 20px; color: var(--text-secondary); max-width: 540px; line-height: 1.5; margin: 0 0 40px; }
  .cta{ display: inline-flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  a.btn{ display: inline-flex; align-items: center; padding: 18px 38px; font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; border-radius: 14px; transition: all 0.2s ease; }
  a.btn-primary{ background: var(--accent); color: var(--bg-deep); border: 1px solid var(--accent); }
  a.btn-primary:hover{ background: var(--text-primary); border-color: var(--text-primary); }
  a.btn-line{ background: transparent; color: var(--text-primary); border: 1px solid var(--bg-line); }
  a.btn-line:hover{ border-color: var(--text-primary); color: var(--text-primary); }
</style>
</head>
<body>
  <div class="code">§ 404 · NOT FOUND</div>
  <h1>Esta ruta<br>no <span class="accent">existe</span>.</h1>
  <p>El cotizador, las verticales y el discovery siguen vivos. Esta URL específica no.</p>
  <div class="cta">
    <a href="/" class="btn btn-primary">← Volver al inicio</a>
    <a href="/quiz.html" class="btn btn-line">Cotizar mi proyecto</a>
  </div>
</body>
</html>
