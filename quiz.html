      <span class="active" data-lang="es">ES</span><span class="slash">/</span><span data-lang="en">EN</span>
    </button>
    <button class="hud-toggle" id="hud-currency" type="button" aria-label="Cambiar moneda">
      <span class="active" data-currency="mxn">MX$</span><span class="slash">/</span><span data-currency="usd">US$</span>

  <span class="hud-divider" aria-hidden="true"></span>
  <div class="hud-group hud-group-ui">

      </div>
      <div class="menu-resumen-row menu-resumen-totalrow">

        <span class="menu-resumen-val menu-resumen-total" id="menu-total">$ 0 <small id="menu-currency">MXN</small></span>
      </div>
      <div class="menu-resumen-row">
        <span class="menu-resumen-key">Módulos activos</span>
        <span class="menu-resumen-val" id="menu-modules">—</span>
      </div>

    <div class="menu-resumen-speed">

      <div class="menu-resumen-row"><span class="menu-resumen-key">Stack</span><span class="menu-resumen-val" id="menu-stack">—</span></div>
    </details>
  </section>

  <div class="menu-section">
    <div class="menu-label">Redes</div>
    <div class="menu-row">
      <a href="https://instagram.com/ibisne" target="_blank" rel="noopener" class="hud-btn" data-icon="instagram"></a>
      <a href="https://linkedin.com/company/ibisne" target="_blank" rel="noopener" class="hud-btn" data-icon="linkedin"></a>
      <a href="https://x.com/ibisne" target="_blank" rel="noopener" class="hud-btn" data-icon="x"></a>
    </div>
  </div>
  <div class="menu-section">
    <div class="menu-label">Preferencias</div>
    <div class="menu-row">

      <button class="hud-btn" id="hud-music-m" type="button" data-icon="play"></button>
